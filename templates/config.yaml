model:
  default: gemini-3.8-flash-medium
  provider: antigravity
  base_url: process://antigravity
fallback_providers: []
agent:
  max_turns: 150
  gateway_timeout: 1800
  restart_drain_timeout: 180
  verbose: false
  reasoning_effort: medium
display:
  streaming: true
  compact: false
  busy_input_mode: interrupt
  tool_progress: all
  cleanup_progress: true
  long_running_notifications: true
  busy_ack_detail: true
  interim_assistant_messages: true
  platforms:
    telegram:
      streaming: true
  runtime_footer:
    enabled: false
    fields: []
streaming:
  enabled: true
  transport: auto
  edit_interval: 0.8
  buffer_threshold: 24
  cursor: ' ▉'
  fresh_final_after_seconds: 60.0
memory:
  memory_enabled: true
  user_profile_enabled: true
session_reset:
  mode: none
  idle_minutes: 1440
sessions:
  auto_prune: false
  retention_days: 365
group_sessions_per_user: true
telegram:
  reactions: false
  extra:
    rich_messages: false
    rich_drafts: false
    drop_pending_on_cold_boot: false
    base_url: https://api.telegram.org/bot
    base_file_url: https://api.telegram.org/file/bot
approvals:
  mode: off
  timeout: 60
kanban:
  dispatch_in_gateway: false
cron:
  wrap_response: true
  mirror_delivery: false
gateway:
  scale_to_zero:
    idle_timeout_minutes: 0
  max_inbound_media_bytes: 134217728
  strict: false
  trust_recent_files: true
  trust_recent_files_seconds: 600
  platforms:
    telegram:
      enabled: true
stt:
  enabled: true
  provider: local
  local:
    model: base
tts:
  provider: edge
  edge:
    voice: id-ID-ArdiNeural
logging:
  level: INFO
  max_size_mb: 10
  backup_count: 3
_config_version: 53
